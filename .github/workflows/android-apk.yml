name: Native Android checks and APK

on:
  push:
    branches: [codex/vspimu-health-intelligence]
    paths:
      - 'native-android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      upload_apk:
        description: 'Upload APK only after verified free storage allowance'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Evaluated before allocating a runner. Fail closed for other/private repos.
    if: >-
      github.repository == 'vyomstudent/IMU-v5' &&
      github.event.repository.visibility == 'public' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/codex/vspimu-health-intelligence'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out authorized source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-13
        with:
          persist-credentials: false

      - name: Select JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4, verified 2026-10-13
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Gradle without persistent caching
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4, verified 2026-10-13
        with:
          gradle-version: '8.9'
          cache-disabled: true
          dependency-graph: disabled

      - name: Prepare Android SDK on cloud runner
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Test dashboard when JS tests are present
        shell: bash
        run: bash native-android/ci/test-dashboard.sh

      - name: Run JVM tests, lint and assemble debug APK
        working-directory: native-android
        shell: bash
        run: gradle --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug

      - name: Record build evidence and APK checksum
        shell: bash
        run: |
          set -euo pipefail
          apk='native-android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          {
            echo '### Native Android build evidence'
            echo "Source commit: $GITHUB_SHA"
            echo 'JVM tests, Android lint and debug assembly completed.'
            echo 'Hardware, emulator and clinical validation are separate requirements.'
            echo 'APK SHA-256:'
            sha256sum "$apk"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain artifact availability
        shell: bash
        env:
          UPLOAD_REQUESTED: ${{ inputs.upload_apk }}
          ALLOWANCE_VERIFIED: ${{ vars.VSPIMU_ARTIFACT_ALLOWANCE_VERIFIED }}
          EVENT_NAME: ${{ github.event_name }}
          UPLOAD_APPROVED: ${{ vars.VSPIMU_APK_UPLOAD_APPROVED }}
        run: |
          if [[ "$ALLOWANCE_VERIFIED" != 'true' || ( "$UPLOAD_REQUESTED" != 'true' && "$UPLOAD_APPROVED" != 'true' ) ]]; then
            echo 'APK upload disabled. This run verifies assembly but provides no downloadable APK. See BUILD.md for the storage verification and authorized rerun requirements.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK only with explicit verified storage allowance
        if: >-
          vars.VSPIMU_ARTIFACT_ALLOWANCE_VERIFIED == 'true' &&
          (inputs.upload_apk == true || vars.VSPIMU_APK_UPLOAD_APPROVED == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, verified 2026-10-13
        with:
          name: vspimu-debug-apk-${{ github.sha }}
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Preserve test and lint reports with the same storage approval
        if: >-
          always() && vars.VSPIMU_ARTIFACT_ALLOWANCE_VERIFIED == 'true' &&
          (inputs.upload_apk == true || vars.VSPIMU_APK_UPLOAD_APPROVED == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vspimu-test-reports-${{ github.sha }}
          path: |
            native-android/app/build/reports/tests/
            native-android/app/build/test-results/
            native-android/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 1
