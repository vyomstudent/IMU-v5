name: Build VSPIMU APK

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Scaffold Kotlin project
        run: |
          python3 <<'PYEOF'
import os, textwrap

BASE = "native-android"
A = "app/src/main"
K = f"{A}/java/com/vspimu/app"
DIRS = [BASE, f"{BASE}/gradle/wrapper", f"{BASE}/{K}",
        f"{BASE}/{A}/res/values", f"{BASE}/{A}/res/xml", f"{BASE}/{A}/assets"]
for d in DIRS:
    os.makedirs(d, exist_ok=True)

FILES = {}

